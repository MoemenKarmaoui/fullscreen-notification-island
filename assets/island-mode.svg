<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="glow-pill" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow-pill" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#glow-pill)"/>

  <g transform="translate(60, 40)">
    <rect width="1080" height="440" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    
    <path d="M 0,310 Q 240,260 500,290 T 1080,290 L 1080,440 L 0,440 Z" fill="#0c1322"/>
    <path d="M 0,360 Q 300,310 600,350 T 1080,340 L 1080,440 L 0,440 Z" fill="#111c33"/>
    <ellipse cx="540" cy="330" rx="280" ry="70" fill="#0284c7" opacity="0.14"/>

    <text x="24" y="416" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      ● FOCUSED SCREEN: FULLSCREEN APPLICATION ACTIVE
    </text>
    <text x="1056" y="416" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      WlrLayer.Overlay (Zero Desktop Clutter)
    </text>

    <!-- CENTERED DANKISLAND PILL -->
    <g transform="translate(315, 34)" filter="url(#shadow-pill)">
      <rect width="450" height="60" rx="30" fill="#0f172a" fill-opacity="0.96"/>
      <rect width="450" height="60" rx="30" fill="none" stroke="url(#pillBorder)" stroke-width="2"/>

      <circle cx="35" cy="30" r="18" fill="#5865F2"/>
      <path d="M 27,24 C 29,22 41,22 43,24 C 44,28 44,35 42,38 C 40,40 37,39 35.5,37 C 34.5,37 33.5,37 32.5,37 C 31,39 28,40 26,38 C 24,35 24,28 27,24 Z" fill="#fff"/>
      <circle cx="31" cy="31" r="1.8" fill="#5865F2"/>
      <circle cx="39" cy="31" r="1.8" fill="#5865F2"/>

      <text x="66" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
        Discord <tspan fill="#94a3b8" font-weight="400">· #general · Hey, are you in game?</tspan>
      </text>

      <rect x="394" y="16" width="38" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="413" y="35" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">+2</text>
    </g>

    <!-- Interactive Hint Annotations below Pill -->
    <g transform="translate(540, 140)">
      <line x1="-120" y1="0" x2="-40" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4"/>
      <circle cx="-40" cy="0" r="3" fill="#38bdf8"/>
      <text x="-130" y="4" text-anchor="end" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Left-Click: Open Default Action</text>

      <line x1="40" y1="0" x2="120" y2="0" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
      <circle cx="40" cy="0" r="3" fill="#ef4444"/>
      <text x="130" y="4" text-anchor="start" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Right-Click: Dismiss</text>
    </g>

    <g transform="translate(290, 200)">
      <rect width="500" height="96" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="250" y="32" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Compact DankIsland Mode</text>
      <text x="250" y="58" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Minimal footprint · Smooth width animations · Shows latest popup</text>
      <text x="250" y="80" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Configurable width, top margin, and optional other-popup badge count</text>
    </g>
  </g>
</svg>
